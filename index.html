<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Город Своих | Мастера и услуги Гагра</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 pb-12 antialiased">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 shadow-xs">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-full bg-emerald-600 flex items-center justify-center text-white font-bold text-sm shadow-xs">
          ГС
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight">Город Своих</h1>
          <p class="text-xs text-slate-500">Каталог проверенных мастеров Гагры</p>
        </div>
      </div>
      <a href="https://chat.whatsapp.com/I9DjXtqIhPBHQEIFDxDtcg" target="_blank" 
         class="text-xs font-medium text-emerald-700 bg-emerald-50 px-2.5 py-1.5 rounded-lg border border-emerald-200 hover:bg-emerald-100 transition">
        В чат ↗
      </a>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4">

    <div class="relative mb-3">
      <input type="text" id="searchInput" placeholder="Поиск (двери, стиралка, обои, сантехник)..." 
             class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 pl-10 text-sm shadow-xs focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
      <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
      <button id="clearSearch" class="hidden absolute right-3 top-3 text-slate-400 hover:text-slate-600">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-3 mb-2" id="categoriesBar">
      <button data-cat="all" class="cat-btn active bg-slate-900 text-white text-xs font-medium px-3.5 py-2 rounded-full whitespace-nowrap shadow-xs transition">
        Все
      </button>
      <button data-cat="doors" class="cat-btn bg-white text-slate-700 border border-slate-200 text-xs font-medium px-3.5 py-2 rounded-full whitespace-nowrap transition">
        🚪 Окна и двери
      </button>
      <button data-cat="appliances" class="cat-btn bg-white text-slate-700 border border-slate-200 text-xs font-medium px-3.5 py-2 rounded-full whitespace-nowrap transition">
        🧺 Техника
      </button>
      <button data-cat="finish" class="cat-btn bg-white text-slate-700 border border-slate-200 text-xs font-medium px-3.5 py-2 rounded-full whitespace-nowrap transition">
        🎨 Отделка
      </button>
      <button data-cat="plumbing" class="cat-btn bg-white text-slate-700 border border-slate-200 text-xs font-medium px-3.5 py-2 rounded-full whitespace-nowrap transition">
        🔧 Сантехника
      </button>
      <button data-cat="electric" class="cat-btn bg-white text-slate-700 border border-slate-200 text-xs font-medium px-3.5 py-2 rounded-full whitespace-nowrap transition">
        ⚡ Электрика
      </button>
      <button data-cat="auto" class="cat-btn bg-white text-slate-700 border border-slate-200 text-xs font-medium px-3.5 py-2 rounded-full whitespace-nowrap transition">
        🚗 Авто
      </button>
    </div>

    <div class="flex justify-between items-center mb-3 px-1 text-xs text-slate-500">
      <span>Найдено мастеров: <strong id="countDisplay" class="text-slate-800">0</strong></span>
      <span class="text-emerald-700 font-medium">● Проверены чатом</span>
    </div>

    <div id="mastersList" class="space-y-3"></div>

    <div id="emptyState" class="hidden text-center py-12 bg-white rounded-2xl border border-slate-200 p-6 mt-4">
      <p class="text-2xl mb-2">🔍</p>
      <h3 class="text-sm font-semibold text-slate-800">Мастер не найден</h3>
      <p class="text-xs text-slate-500 mt-1 max-w-xs mx-auto">Попробуйте изменить запрос или спросите рекомендацию в чате.</p>
    </div>

  </main>

  <script>
    let masters = [];
    let activeCategory = 'all';

    async function loadData() {
      try {
        const response = await fetch('data/masters.json?v=' + Date.now());
        masters = await response.json();
        render();
      } catch (err) {
        console.error('Ошибка загрузки data/masters.json:', err);
      }
    }

    function render() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const listEl = document.getElementById('mastersList');
      const emptyEl = document.getElementById('emptyState');
      const countEl = document.getElementById('countDisplay');

      const filtered = masters.filter(m => {
        const matchesCategory = (activeCategory === 'all') || (m.category === activeCategory);
        const matchesSearch = !query || 
          m.name.toLowerCase().includes(query) || 
          m.service.toLowerCase().includes(query) || 
          m.category_title.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });

      countEl.textContent = filtered.length;
      listEl.innerHTML = '';

      if (filtered.length === 0) {
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');

      filtered.forEach(m => {
        const cleanPhone = m.phone.replace(/[^0-9]/g, '');
        const waText = encodeURIComponent(`Здравствуйте, ${m.name}! Нашел ваш контакт в каталоге мастеров "Город Своих" (Гагра).`);
        const waLink = `https://wa.me/${cleanPhone}?text=${waText}`;
        const telLink = `tel:${m.phone}`;

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs hover:border-slate-300 transition";
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-2">
            <div>
              <span class="inline-block text-[11px] font-medium bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md mb-1">
                ${m.category_title}
              </span>
              <h3 class="text-base font-bold text-slate-900">${m.name}</h3>
            </div>
            ${m.verified ? `
              <span class="inline-flex items-center text-[10px] font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded-full whitespace-nowrap">
                ✓ Проверен
              </span>
            ` : ''}
          </div>
          
          <p class="text-xs text-slate-600 mb-3 leading-relaxed">${m.service}</p>
          
          ${m.recommended_by ? `
            <div class="text-[11px] text-slate-600 mb-3.5 flex items-center gap-1 bg-slate-50 p-2 rounded-lg border border-slate-100">
              <span>⭐</span>
              <span>Рекомендация: <span class="font-medium text-slate-700">${m.recommended_by}</span></span>
            </div>
          ` : ''}

          <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-100">
            <a href="${waLink}" target="_blank" 
               class="flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2.5 px-3 rounded-xl transition shadow-xs">
              <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
              </svg>
              WhatsApp
            </a>
            <a href="${telLink}" 
               class="flex items-center justify-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold py-2.5 px-3 rounded-xl transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
              </svg>
              Позвонить
            </a>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      document.getElementById('clearSearch').classList.toggle('hidden', !e.target.value);
      render();
    });

    document.getElementById('clearSearch').addEventListener('click', () => {
      const input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('clearSearch').classList.add('hidden');
      render();
    });

    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => {
          b.className = 'cat-btn bg-white text-slate-700 border border-slate-200 text-xs font-medium px-3.5 py-2 rounded-full whitespace-nowrap transition';
        });
        btn.className = 'cat-btn active bg-slate-900 text-white text-xs font-medium px-3.5 py-2 rounded-full whitespace-nowrap shadow-xs transition';
        activeCategory = btn.dataset.cat;
        render();
      });
    });

    loadData();
  </script>
</body>
</html>
