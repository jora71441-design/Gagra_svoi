name: Update Rent Data

on:
  schedule:
    # Запуск каждые 6 часов
    - cron: '0 */6 * * *'
  workflow_dispatch: # Позволяет запускать вручную кнопкой в Actions

jobs:
  parse:
    runs-on: ubuntu-latest

    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Запуск парсера Telegram
        run: |
          python scripts/parse_rent_tg.py

      - name: Коммит и пуш обновленного rent.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rent.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: обновление базы аренды из TG канала" && git push)
