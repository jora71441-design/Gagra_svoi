name: Parse WhatsApp Chat

on:
  push:
    paths:
      - '_chat.txt'
      - 'scripts/parser.py'
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run parser
        run: |
          mkdir -p data
          python scripts/parser.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/masters.json
          git commit -m "auto: update masters database" || echo "No changes to commit"
          git push
