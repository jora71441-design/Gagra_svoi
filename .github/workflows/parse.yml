name: Parse WhatsApp Chat

on:
  push:
    paths:
      - '_chat.txt'
      - '*.zip'
      - 'data/*.zip'
      - 'data/jobs_chat.txt'
      - 'scripts/parser.py'
      - 'scripts/parse_jobs.py'
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run parsers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p data
          python scripts/parser.py
          python scripts/parse_jobs.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/masters.json data/jobs.json
          git commit -m "auto: update masters and jobs databases" || echo "No changes to commit"
          git push
